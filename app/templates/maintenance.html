{% extends "base.html" %}
{% block content %}

<h2>🛠 Maintenance & Service Logs</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Date</th>
        <th>Task</th>
        <th>Status</th>
    </tr>

    {% for record in records %}
    <tr>
        <td>{{ record.date }}</td>
        <td>{{ record.task }}</td>
        <td>{{ record.status }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
